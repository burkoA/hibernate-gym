
spring:
  datasource:
    url: jdbc:mysql://stg-db-server:3306/gym_stg?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  logging:
    level:
      root: WARN
      epam.arsen.burko.gym: INFO
      org.springframework.web: WARN
      org.springframework.security: WARN
      org.hibernate: WARN
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file:
      name: /var/log/gym/application-stg.log
      max-size: 100MB
      max-history: 30
      total-size-cap: 1GB

  jackson:
    serialization:
      indent_output: false

app:
  environment: stg
  debug-mode: false
  log-requests: true
  request-timeout: 30000
  cache-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  ssl:
    enabled: false

logging:
  level:
    root: WARN
    epam.arsen.burko.gym: INFO
  file:
    name: /var/log/gym/application-stg.log
    max-size: 100MB

