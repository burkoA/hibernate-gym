spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/gym_prod?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  logging:
    level:
      root: ERROR
      epam.arsen.burko.gym: WARN
      org.springframework: ERROR
      org.springframework.security: ERROR
      org.hibernate: ERROR
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file:
      name: /var/log/gym/application-prod.log
      max-size: 500MB
      max-history: 90
      total-size-cap: 10GB

  jackson:
    serialization:
      indent_output: false

app:
  environment: prod
  debug-mode: false
  log-requests: false
  request-timeout: 60000
  cache-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /management
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 2048
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
  shutdown: graceful
  tomcat:
    max-connections: 1000
    threads:
      max: 200
      min-spare: 10

logging:
  level:
    root: ERROR
    epam.arsen.burko.gym: WARN
  file:
    name: /var/log/gym/application-prod.log
    max-size: 500MB
security:
  require-https: true
  cors:
    enabled: true
    max-age: 3600

